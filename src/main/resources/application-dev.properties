## ============================================================
## dev profile — local Postgres (`docker compose up`); chatty logs.
## ============================================================

# Local Postgres (matches docker-compose.yml at the project root). Overridable via the same
# MEALPREP_DB_* env vars prod uses, so a dogfood stack on a non-default port (e.g. pgvector on
# :5434) needs no property edits.
spring.datasource.url=${MEALPREP_DB_URL:jdbc:postgresql://localhost:5432/mealprep_dev}
spring.datasource.username=${MEALPREP_DB_USERNAME:mealprep_dev}
spring.datasource.password=${MEALPREP_DB_PASSWORD:mealprep_dev}

# Hibernate validates the schema Flyway produced; never auto-mutates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging — verbose in dev so flow is easy to read.
logging.level.root=INFO
logging.level.com.example.mealprep=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.web=DEBUG

# Swagger UI on in dev so the OpenAPI contract is browsable.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# AI keys — real keys via env if set; otherwise BLANK. A blank openai key means the OpenAIClient
# bean is absent (OpenAiSdkConfig's non-blank gate), so every AI touchpoint sees
# AiUnavailableException and degrades gracefully (Stage C → deterministic top-composite pick).
# The previous "dev-stub-openai-key" default created a REAL client whose calls failed with a
# fatal 401 (AiInvalidRequestException) — a crash, not a degrade.
mealprep.ai.anthropic-api-key=${ANTHROPIC_API_KEY:dev-stub-anthropic-key}
mealprep.ai.openai-api-key=${OPENAI_API_KEY:}

# Dev dogfood seeding + cold-start. recipe-pool-path: optional JSON file (List<DatasetRecipe> —
# the e2e import-pool shape) seeded into an EMPTY SYSTEM catalogue at startup by
# DevRecipePoolSeeder; keep dataset files (e.g. CC BY-NC datahive slices) OUTSIDE the repo.
# Cold-start discovery is off in dev: the seeded pool is the catalogue, and dev has no usable
# discovery sources (Google CSE key is a placeholder) — the 20s sync discovery wait per
# generation would be pure latency.
mealprep.dev.recipe-pool-path=${MEALPREP_DEV_RECIPE_POOL:}
mealprep.planner.cold-start.enabled=false

# Auth — dev runs over plain HTTP, so the cookie cannot require Secure.
mealprep.auth.cookie-secure=false

# CORS — Vite dev server runs on :5173; allow it to call the API.
# These properties are bound only when the `dev` profile is active (see DevCorsConfiguration).
mealprep.cors.allowed-origin=http://localhost:5173
mealprep.cors.preflight-max-age=PT1H
