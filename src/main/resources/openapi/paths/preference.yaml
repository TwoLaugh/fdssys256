      upsert precedent).
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../schemas/preference.yaml#/UpdateLifestyleConfigRequest' }
    responses:
      '200':
        description: The updated (or, on first write, newly created) lifestyle config.
        content:
          application/json:
            schema: { $ref: '../schemas/preference.yaml#/LifestyleConfigDto' }
      '400':
        description: Validation or syntactic error.
        content:
          application/problem+json:
            schema: { $ref: '../schemas/common.yaml#/ProblemDetail' }
      '401':
        description: Missing or invalid authentication.
        content:
          application/problem+json:
            schema: { $ref: '../schemas/common.yaml#/ProblemDetail' }
      '404':
        description: >-
          No config exists and expectedVersion is greater than 0 — a stale client, not a create
          intent. A first write must send expectedVersion 0.
        content:
          application/problem+json:
            schema: { $ref: '../schemas/common.yaml#/ProblemDetail' }
      '409':
        description: >-
          Optimistic-lock conflict (stale expectedVersion, including the losing side of a
          concurrent first-write double-submit).
        content:
          application/problem+json:
            schema: { $ref: '../schemas/common.yaml#/ProblemDetail' }
