# ============================================================================
# Taste profile (01c) — query + manual override + async refresh + rollback.
# ============================================================================
tasteProfile:
  get:
    tags: [Preferences]
    operationId: getTasteProfile
    summary: Read the calling user's taste profile.
    security:
      - cookieAuth: []
    responses:
      '200':
        description: The user's taste profile.
        content:
          application/json:
            schema: { $ref: '../schemas/preference.yaml#/TasteProfileDto' }
      '401':
        description: Missing or invalid authentication.
        content:
          application/problem+json:
            schema: { $ref: '../schemas/common.yaml#/ProblemDetail' }
      '404':
        description: Profile not initialised.
        content:
          application/problem+json:
            schema: { $ref: '../schemas/common.yaml#/ProblemDetail' }
  put:
    tags: [Preferences]
    operationId: updateTasteProfile
    summary: Replace the calling user's taste profile document (manual override).
    description: >-
      Full-document replace. Server-managed scalars inside the document are RE-STAMPED server-side
      and any client-supplied values for them are ignored: `version` and `lastUpdated` are bumped
      in lock-step with the entity's `documentVersion`, and `basedOnFeedbackCount` /
      `feedbackCursor` are copied from the server's own state (the delta-pipeline bookkeeping a
      manual override must not be able to drift). The ~2500-token document budget is enforced on
      this path exactly as on the AI delta path — an oversized pasted document is rejected 422
      with no write.
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../schemas/preference.yaml#/UpdateTasteProfileRequest' }
    responses:
      '200':
        description: The updated taste profile.
        content:
          application/json:
            schema: { $ref: '../schemas/preference.yaml#/TasteProfileDto' }
      '400':
        description: Validation or syntactic error.
        content:
          application/problem+json:
            schema: { $ref: '../schemas/common.yaml#/ProblemDetail' }
      '401':
        description: Missing or invalid authentication.
        content:
          application/problem+json:
            schema: { $ref: '../schemas/common.yaml#/ProblemDetail' }
      '404':
        description: Profile not initialised.
        content:
          application/problem+json:
            schema: { $ref: '../schemas/common.yaml#/ProblemDetail' }
      '409':
        description: Stale expectedVersion.
        content:
          application/problem+json:
            schema: { $ref: '../schemas/common.yaml#/ProblemDetail' }
      '422':
        description: Document exceeds the ~2500-token taste-profile budget; nothing was written.
        content:
          application/problem+json:
            schema: { $ref: '../schemas/common.yaml#/ProblemDetail' }
tasteProfileRefreshNow:
  post:
    tags: [Preferences]
    operationId: triggerTasteProfileRefresh
    summary: Request an asynchronous AI refresh of the taste profile.
    security:
      - cookieAuth: []
    requestBody:
      required: false
      content:
        application/json:
          schema: { $ref: '../schemas/preference.yaml#/TriggerTasteProfileRefreshRequest' }
    responses:
      '202':
        description: Refresh requested; returns the current state immediately.
        content:
          application/json:
            schema: { $ref: '../schemas/preference.yaml#/TasteProfileDto' }
      '401':
        description: Missing or invalid authentication.
        content:
          application/problem+json:
            schema: { $ref: '../schemas/common.yaml#/ProblemDetail' }
      '404':
        description: Profile not initialised.
        content:
          application/problem+json:
            schema: { $ref: '../schemas/common.yaml#/ProblemDetail' }
tasteProfileRollback:
  post:
    tags: [Preferences]
    operationId: rollbackTasteProfile
    summary: >-
      Roll the calling user's taste profile back to a prior version (restored as a new monotonic
      version) and replay feedback from that version's cursor forward.
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../schemas/preference.yaml#/RollbackTasteProfileRequest' }
    responses:
      '200':
        description: The rolled-back taste profile (restored document at the new monotonic version).
        content:
          application/json:
            schema: { $ref: '../schemas/preference.yaml#/TasteProfileDto' }
      '400':
        description: Validation or syntactic error.
        content:
          application/problem+json:
            schema: { $ref: '../schemas/common.yaml#/ProblemDetail' }
      '401':
        description: Missing or invalid authentication.
        content:
          application/problem+json:
            schema: { $ref: '../schemas/common.yaml#/ProblemDetail' }
      '404':
        description: Profile not initialised, or the target version has no snapshot.
        content:
          application/problem+json:
            schema: { $ref: '../schemas/common.yaml#/ProblemDetail' }
      '409':
        description: Stale expectedVersion (profile was concurrently edited).
        content:
          application/problem+json:
            schema: { $ref: '../schemas/common.yaml#/ProblemDetail' }
