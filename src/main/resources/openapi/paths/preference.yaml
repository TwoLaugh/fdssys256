      '404':
        description: Resource not found.
        content:
          application/problem+json:
            schema: { $ref: '../schemas/common.yaml#/ProblemDetail' }
  put:
    tags: [Preferences]
    operationId: updateLifestyleConfig
    summary: >-
      Replace the calling user's lifestyle config; a first write (expectedVersion 0, no config yet)
      creates it.
    description: >-
      Full-replace with optimistic locking. Upsert-on-first-PUT (onboarding G1): when no config
