hardConstraints:
  get:
    tags: [Preferences]
    operationId: getHardConstraints
    summary: Read the calling user's hard-constraints aggregate.
    security:
      - cookieAuth: []
    responses:
      '200':
        description: The user's hard-constraints aggregate.
        content:
          application/json:
            schema: { $ref: '../schemas/preference.yaml#/HardConstraintsDto' }
      '401':
        description: Missing or invalid authentication.
        content:
          application/problem+json:
            schema: { $ref: '../schemas/common.yaml#/ProblemDetail' }
      '404':
        description: Resource not found.
        content:
          application/problem+json:
            schema: { $ref: '../schemas/common.yaml#/ProblemDetail' }
  put:
    tags: [Preferences]
    operationId: updateHardConstraints
    summary: >-
      Replace the calling user's hard-constraints aggregate; a first write (expectedVersion 0, no
      aggregate yet) creates it.
    description: >-
      Full-replace with optimistic locking. Upsert-on-first-PUT (onboarding G1): when no aggregate
      exists and expectedVersion is 0, the aggregate is initialised (omnivore defaults) and the
      document applied in one transaction — insert and update both return 200 (matching the
      provisions budget upsert precedent). The first write is addition-only, so the GAP-04
      Tier-1-removal interstitial never triggers on it.
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../schemas/preference.yaml#/UpdateHardConstraintsRequest' }
    responses:
      '200':
        description: The updated (or, on first write, newly created) hard-constraints aggregate.
        content:
          application/json:
            schema: { $ref: '../schemas/preference.yaml#/HardConstraintsDto' }
      '400':
        description: Validation or syntactic error.
        content:
          application/problem+json:
            schema: { $ref: '../schemas/common.yaml#/ProblemDetail' }
      '401':
        description: Missing or invalid authentication.
        content:
          application/problem+json:
            schema: { $ref: '../schemas/common.yaml#/ProblemDetail' }
      '404':
        description: >-
          No aggregate exists and expectedVersion is greater than 0 — a stale client, not a create
          intent. A first write must send expectedVersion 0.
        content:
          application/problem+json:
            schema: { $ref: '../schemas/common.yaml#/ProblemDetail' }
      '409':
        description: >-
          Conflict. Either an optimistic-lock failure (stale expectedVersion, including the losing
          side of a concurrent first-write double-submit) or — per GAP-04 — the request would
          remove a Tier-1 hard constraint (allergy / medical diet / severe intolerance /
          dietary-identity base) without confirmTier1Removals=true. The latter carries
          reason=TIER1_REMOVAL_REQUIRES_CONFIRMATION and the removedConstraints the UI
          names in the confirmation interstitial.
        content:
          application/problem+json:
            schema:
              oneOf:
                - { $ref: '../schemas/preference.yaml#/Tier1RemovalConfirmationProblem' }
                - { $ref: '../schemas/common.yaml#/ProblemDetail' }
hardConstraintsAuditLog:
  get:
    tags: [Preferences]
    operationId: getHardConstraintsAuditLog
    summary: Paginated audit log of hard-constraints changes; newest-first.
    security:
      - cookieAuth: []
    parameters:
      - in: query
        name: page
        schema: { type: integer, minimum: 0, default: 0 }
      - in: query
        name: size
        schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    responses:
      '200':
        description: Page of audit-log entries; empty content when no changes (or no aggregate yet).
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: array
                  items: { $ref: '../schemas/preference.yaml#/HardConstraintsAuditEntryDto' }
                totalElements: { type: integer }
                totalPages: { type: integer }
                number: { type: integer }
                size: { type: integer }
      '400':
        description: Validation or syntactic error.
        content:
          application/problem+json:
            schema: { $ref: '../schemas/common.yaml#/ProblemDetail' }
      '401':
        description: Missing or invalid authentication.
        content:
          application/problem+json:
            schema: { $ref: '../schemas/common.yaml#/ProblemDetail' }
