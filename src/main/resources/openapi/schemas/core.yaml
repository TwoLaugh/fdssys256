DecisionLogDto:
  type: object
  required: [decisionId, traceId, scopeKind, scopeId, scale, triggeredBy, inputs, iteration, createdAt]
  properties:
    decisionId: { type: string, format: uuid }
    traceId: { type: string, format: uuid }
    parentDecisionId: { type: string, format: uuid, nullable: true }
    scopeKind: { type: string, example: "plan-week" }
    scopeId: { type: string, format: uuid }
    scale: { type: string, enum: [WEEK, RECIPE, OTHER] }
    triggeredBy: { type: string, example: "user-initiated" }
    actorUserId: { type: string, format: uuid, nullable: true }
    inputs:
      type: object
      additionalProperties: true
    candidates:
      type: object
      nullable: true
      additionalProperties: true
    chosen:
      type: object
      nullable: true
      additionalProperties: true
    reasoning: { type: string, nullable: true }
    emittedDirective:
      type: object
      nullable: true
      additionalProperties: true
    iteration: { type: integer, minimum: 0 }
    durationMs: { type: integer, nullable: true }
    createdAt: { type: string, format: date-time }
AdminStatusDto:
  type: object
  required: [status, checkedAt, dbConnected, aiMonthToDatePence]
  properties:
    status:
      type: string
      enum: [UP, DEGRADED]
      description: UP when the database is reachable; DEGRADED otherwise.
    checkedAt:
      type: string
      format: date-time
      description: When this snapshot was taken (UTC).
    dbConnected:
      type: boolean
      description: True when a validation probe against the primary datasource succeeded.
    lastAiCallAt:
      type: string
      format: date-time
      nullable: true
      description: Most recent AI provider call attempt, or null if none logged.
    lastUsdaCallAt:
      type: string
      format: date-time
      nullable: true
      description: >-
        Most recent USDA call this process made, or null if none since startup
        (in-memory, single-instance signal; resets on restart).
    aiMonthToDatePence:
      type: number
      description: System-wide AI spend in pence from the start of the current calendar month (UTC).
AncestryResponse:
  type: object
  required: [ancestors, cycleDetected]
  properties:
    ancestors:
      type: array
      items: { $ref: '#/DecisionLogDto' }
    cycleDetected:
      type: boolean
      description: True when the walk hit maxDepth — caller should investigate the parent chain.
